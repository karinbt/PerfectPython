name: Build CPython

run-name: Build CPython ${{ inputs.py_ver }} (win=${{ inputs.win_runner }}, mac=macos-15)

on:
  workflow_dispatch:
    inputs:
      py_ver:
        description: CPython 版本号（决定下载的源码包与产物名）
        type: string
        default: "3.12.14"
      win_runner:
        description: Windows 构建镜像（默认 2025；出问题可临时切回 2022）
        type: choice
        default: windows-2025
        options:
          - windows-2025
          - windows-2022
          - windows-2025-vs2026

env:
  # 单一版本来源：workflow 名称不再硬编码版本，避免 name 与 PY_VER 不一致
  PY_VER: ${{ inputs.py_ver }}

jobs:
  # ========== Windows x64 (PGO) ==========
  windows:
    # 从 windows-2022 迁到 windows-2025。
    # 注意：不要用 windows-latest —— latest 正在向 VS2026(v18) 迁移，
    # 而 CPython 3.12 的 PCbuild 只认 VisualStudioVersion 15/16/17。
    runs-on: ${{ inputs.win_runner || 'windows-2025' }}
    timeout-minutes: 120
    steps:
      - name: Download source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ver = "${{ env.PY_VER }}"
          # -f 不能省：404 时 curl 默认会把错误页当正文存下来，
          # 报错要等到解压那步才出现，极具误导性。
          curl.exe -fL -o src.tar.xz "https://www.python.org/ftp/python/$ver/Python-$ver.tar.xz"
          if ($LASTEXITCODE -ne 0) { throw "下载失败：Python-$ver.tar.xz 不存在？" }

      - name: Extract source (7-Zip)
        shell: pwsh
        run: |
          $ver = "${{ env.PY_VER }}"
          7z x src.tar.xz -y | Out-Null
          7z x src.tar -y    | Out-Null
          Rename-Item "Python-$ver" cpython

      # 显式锁定 MSVC 工具链：
      #  - CPython 3.12 的 PCbuild/python.props 只匹配 VisualStudioVersion 15/16/17，遇到 VS2026(18.0) 会回退到不存在的 v140；
      #  - PCbuild/find_msbuild.bat 用 `vswhere -latest -prerelease` 永远挑最新的 VS。
      # 因此这里自己选实例、写入 MSBUILD，并在下一步显式传 PlatformToolset。
      - name: Pin MSVC toolchain (v143)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          Write-Host "=== Visual Studio instances on this image ==="
          & $vswhere -all -products * -property catalog_productDisplayVersion

          # 1) 优先 VS2022（VisualStudioVersion=17.x，CPython 3.12 原生支持 v143）
          $inst = & $vswhere -products * -version "[17.0,18.0)" `
                    -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
                    -latest -property installationPath
          # 2) 回退：VS2026 镜像里仍带 v143(14.44) 侧装工具集
          if (-not $inst) {
            $inst = & $vswhere -products * `
                      -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
                      -latest -property installationPath
            if (-not $inst) { throw "No MSVC x64 toolchain found on this runner image" }
            Write-Host "::warning::VS2022 not found, falling back to: $inst"
          }

          $toolsets = (Get-ChildItem "$inst\VC\Tools\MSVC" -Directory).Name
          Write-Host "VS install   : $inst"
          Write-Host "MSVC toolsets: $($toolsets -join ', ')"
          if (-not ($toolsets | Where-Object { $_ -like '14.3*' -or $_ -like '14.4*' })) {
            throw "v143 (14.3x/14.4x) toolset missing -- CPython 3.12 cannot be built on this image"
          }

          # v143 具体映射到哪个 14.x，由这个 props 决定。镜像上同时存在 v142(14.29) 与
          # VS2026 的 14.5x 时，光看"有没有 14.3x/14.4x 目录"是判断不出实际用了哪个的。
          $v143Props = Join-Path $inst 'VC\Auxiliary\Build\Microsoft.VCToolsVersion.v143.default.props'
          if (Test-Path $v143Props) {
            $m = Select-String -Path $v143Props -Pattern '<VCToolsVersion[^>]*>([\d\.]+)<' | Select-Object -First 1
            if ($m) { Write-Host "v143 resolves: MSVC $($m.Matches[0].Groups[1].Value)" }
          } else {
            Write-Host "::warning::没找到 $v143Props —— /p:PlatformToolset=v143 可能落不到预期工具集，以 Verify 步骤的 MSC 版本为准"
          }

          $msbuild = Join-Path $inst 'MSBuild\Current\Bin\amd64\MSBuild.exe'
          if (-not (Test-Path $msbuild)) { $msbuild = Join-Path $inst 'MSBuild\Current\Bin\MSBuild.exe' }
          if (-not (Test-Path $msbuild)) { throw "MSBuild.exe not found under $inst" }
          Write-Host "MSBuild      : $msbuild"

          Add-Content $env:GITHUB_ENV "MSBUILD=$msbuild"
          Add-Content $env:GITHUB_ENV "PY_TOOLSET=v143"
          Add-Content $env:GITHUB_ENV "VSINSTALL=$inst"

      - name: Build with MSVC (PGO)
        shell: cmd
        working-directory: cpython
        # 含 '=' 的参数必须整体加引号，build.bat 会原样透传给 MSBuild（PGInstrument/PGUpdate 两趟都生效）
        run: PCbuild\build.bat -e -p x64 --pgo "/p:PlatformToolset=%PY_TOOLSET%"

      # --preset-default 会带上 include/ 与 libs/python312.lib，
      # Nuitka / cffi / 任何要编译扩展的第三方库都依赖它们，别换成 --preset-embed。
      - name: Make portable layout
        shell: cmd
        working-directory: cpython
        run: >
          PCbuild\amd64\python.exe PC\layout
          --source .
          --build PCbuild\amd64
          --copy ..\_out\python-${{ env.PY_VER }}-win64
          --preset-default
          --precompile

      - name: Verify build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = "_out\python-${{ env.PY_VER }}-win64"
          $py  = "$out\python.exe"

          Write-Host "=== 版本与编译器 ==="
          $vv = (& $py -VV) -join ' '
          Write-Host $vv
          # 工具集硬闸门。MSC v.19XX 与 MSVC 14.XX 一一对应（14.44 -> MSC v.1944），
          # 这是唯一能证明 /p:PlatformToolset=v143 真的生效的证据：
          # 镜像上同时装着 v142(14.29) 和 VS2026 的 14.5x，只看目录存在与否查不出来。
          if ($vv -notmatch 'MSC v\.(\d{4})') { throw "无法从 -VV 解析 MSC 版本：$vv" }
          $msc = [int]$Matches[1]
          Write-Host "MSC v.$msc  =>  MSVC 14.$($msc - 1900)"
          if ($msc -lt 1930) {
            throw "工具集回退到了 v142 或更早（MSC v.$msc）—— /p:PlatformToolset=v143 没生效"
          }
          if ($msc -gt 1949) {
            Write-Host "::warning::用的不是 v143 家族（MSC v.$msc，疑似 VS2026 工具集），请确认下面 vcruntime 的版本与之匹配"
          }

          Write-Host "=== 绿色包必须自带 VC 运行时 ==="
          # 注意：runner 自己装了 VC++ 运行库，System32 里有 vcruntime140.dll，
          # 所以"python.exe 能跑"并不能证明产物自包含 —— 必须直接查文件在不在。
          $vcr = @(Get-ChildItem "$out\vcruntime*.dll" -ErrorAction SilentlyContinue)
          if ($vcr.Count -eq 0) {
            Write-Host "::warning::layout 没带上 vcruntime140.dll，正在从所选工具集的 redist 补齐"
            $src = @(Get-ChildItem "$env:VSINSTALL\VC\Redist\MSVC\*\x64\Microsoft.VC143.CRT\vcruntime140*.dll" -ErrorAction SilentlyContinue |
                     Sort-Object FullName | Select-Object -Last 2)
            if ($src.Count -eq 0) { throw "找不到 vcruntime140.dll，产物无法自包含（目标机没装 VC++ 运行库就起不来）" }
            $src | ForEach-Object { Copy-Item $_.FullName $out -Force; Write-Host "copied: $($_.FullName)" }
            $vcr = @(Get-ChildItem "$out\vcruntime*.dll")
          }
          $vcr | ForEach-Object { Write-Host ("  {0}  {1}" -f $_.Name, $_.VersionInfo.FileVersion) }

          Write-Host "=== 必需模块（任一失败即构建失败）==="
          & $py -c "import ssl, lzma, sqlite3, ctypes, zlib, bz2, hashlib, decimal, socket, uuid; print('OK', ssl.OPENSSL_VERSION)"
          if ($LASTEXITCODE -ne 0) { throw "必需模块自检失败" }

          Write-Host "=== 开发件（Nuitka/cffi 需要）==="
          $mm  = $env:PY_VER.Split('.')[0] + $env:PY_VER.Split('.')[1]
          $lib = "$out\libs\python$mm.lib"
          if (-not (Test-Path $lib))               { throw "缺少 $lib —— layout 没带上 dev 文件，Nuitka 无法链接" }
          if (-not (Test-Path "$out\include\Python.h")) { throw "缺少 include/Python.h" }
          if (-not (Test-Path "$out\python$mm.dll"))   { throw "缺少 python$mm.dll" }

          Write-Host "=== 可选件（只报告，不拦截）==="
          & $py -c "import pip; print('pip', pip.__version__)"
          & $py -c "import tkinter; print('tkinter', tkinter.TkVersion)"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: python-${{ env.PY_VER }}-win64
          path: _out/python-${{ env.PY_VER }}-win64
          if-no-files-found: error

  # ========== macOS arm64 绿色包 (PGO + LTO, 自包含) ==========
  macos:
    # 固定 macos-15(arm64)：macos-latest 已漂移到 macOS 26，pin 住才能保证产物系统兼容性可复现
    runs-on: macos-15
    timeout-minutes: 150
    defaults:
      run:
        shell: bash
    env:
      # ★ 产物的系统下限：刻意锁定 macOS 15.0，不是笔误 ★
      #   决策依据：
      #     1) Nuitka 生态里相当多的预编译类库/wheel 自身就要求 15.0+，
      #        把下限压到 11.0 并不能让这些依赖跟着能用，收益是假的；
      #     2) arm64 机型上 15.0 已经是"还值得支持的最低版本"。
      #   代价是明确的、不可逆的：产物在 macOS 11~14 上会被 dyld 直接拒绝加载
      #   （cannot load ... built for macOS 15.0 which is newer than running OS），
      #   连解释器都进不去，任何自检脚本都跑不起来 —— 所以它必须随包公示，
      #   见下面 Package 步骤生成的 BUILD-INFO.txt。
      #   改这个值时下面所有静态依赖会自动跟着重编（它们共用这一个变量）。
      MACOSX_DEPLOYMENT_TARGET: "15.0"
      # 静态依赖一律自编：版本可 pin、可审计，既不跟 runner 镜像漂移，
      # 也不跟【用户的】系统漂移 —— 后者更隐蔽：链系统 /usr/lib 的话，
      # 同一个包在 macOS 15 上 sqlite 是 3.4x、在 26 上就变成 3.5x。
      # zlib / sqlite 的版本特意与 Windows 侧（CPython externals）对齐。
      OPENSSL_VER: "3.6.5"
      XZ_VER: "5.8.4"
      ZLIB_VER: "1.3.2"
      SQLITE_VER: "3.53.4"
      SQLITE_YEAR: "2026"   # sqlite.org 下载目录按发布年份分，改版本时别忘了同步改年份
    steps:
      - name: Derive paths
        run: |
          set -eu
          {
            echo "PYMM=${PY_VER%.*}"
            echo "PY_PREFIX=/opt/python-$PY_VER"
            echo "PYROOT=$GITHUB_WORKSPACE/_stage/opt/python-$PY_VER"
            echo "DEPS=$RUNNER_TEMP/deps-static"
            echo "NPROC=$(sysctl -n hw.logicalcpu)"
          } >> "$GITHUB_ENV"

      - name: Download & extract source
        run: |
          set -eux
          curl -fL -o src.tar.xz "https://www.python.org/ftp/python/$PY_VER/Python-$PY_VER.tar.xz"
          shasum -a 256 src.tar.xz
          tar -xf src.tar.xz
          mv "Python-$PY_VER" cpython

      # 用源码自编静态 openssl / xz，取代 brew 的 .a。三个好处：
      #  1) 部署目标真正落在 11.0（brew bottle 编译目标 = runner 系统，会把产物 minos 抬到 15.0）；
      #  2) 版本可 pin、可审计，不随 runner 镜像漂移；
      #  3) --openssldir 指到系统 /private/etc/ssl，产物开箱就能用 macOS 自带 cert.pem 校验证书。
      - name: Build static deps from source (openssl + xz)
        run: |
          set -eux
          mkdir -p "$DEPS/lib" "$DEPS/include"
          case "$(uname -m)" in
            arm64)  OSSL_TARGET=darwin64-arm64-cc  ;;
            x86_64) OSSL_TARGET=darwin64-x86_64-cc ;;
            *) echo "::error::未知架构 $(uname -m)"; exit 1 ;;
          esac

          cd "$RUNNER_TEMP"
          curl -fL -o openssl.tar.gz \
            "https://github.com/openssl/openssl/releases/download/openssl-$OPENSSL_VER/openssl-$OPENSSL_VER.tar.gz"
          shasum -a 256 openssl.tar.gz
          tar -xf openssl.tar.gz
          ( cd "openssl-$OPENSSL_VER"
            ./Configure "$OSSL_TARGET" no-shared no-tests no-docs \
              --prefix="$DEPS" --openssldir=/private/etc/ssl \
              "-mmacosx-version-min=$MACOSX_DEPLOYMENT_TARGET"
            make -j"$NPROC" build_libs
            make install_dev )          # 只装 头文件+静态库+pc，不碰系统 /etc/ssl

          curl -fL -o xz.tar.gz \
            "https://github.com/tukaani-project/xz/releases/download/v$XZ_VER/xz-$XZ_VER.tar.gz"
          shasum -a 256 xz.tar.gz
          tar -xf xz.tar.gz
          ( cd "xz-$XZ_VER"
            ./configure --prefix="$DEPS" --disable-shared --enable-static \
              --disable-xz --disable-xzdec --disable-lzmadec --disable-lzmainfo \
              --disable-scripts --disable-doc
            make -j"$NPROC"
            make install )

          # --- zlib ---
          # 不用系统的 /usr/lib/libz.1.dylib：Apple 那份长期停在 1.2.12，
          # 版本号会让各类安全扫描器报 CVE-2022-37434（虽然 CPython 从不调用
          # 出问题的 inflateGetHeader，实际不可达），而且它随用户系统漂移。
          curl -fL -o zlib.tar.gz \
            "https://github.com/madler/zlib/releases/download/v$ZLIB_VER/zlib-$ZLIB_VER.tar.gz"
          shasum -a 256 zlib.tar.gz
          tar -xf zlib.tar.gz
          ( cd "zlib-$ZLIB_VER"
            CFLAGS="-O3 -fPIC -mmacosx-version-min=$MACOSX_DEPLOYMENT_TARGET" \
              ./configure --prefix="$DEPS" --static
            make -j"$NPROC"
            make install )

          # --- SQLite（直接编 amalgamation，不碰它自带的 configure）---
          # SQLite 3.48 起把构建系统从 GNU autoconf 换成了 autosetup，选项语义变了、
          # 且对未知选项是直接报错而不是警告。我们只要一个 .a，amalgamation 就三个
          # 文件，自己编最稳，也不会随上游构建系统改版而炸。
          SQLITE_CODE=$(awk -F. '{printf "%d%02d%02d00", $1, $2, $3}' <<<"$SQLITE_VER")
          curl -fL -o sqlite.tar.gz \
            "https://sqlite.org/$SQLITE_YEAR/sqlite-autoconf-$SQLITE_CODE.tar.gz"
          shasum -a 256 sqlite.tar.gz
          tar -xf sqlite.tar.gz
          ( cd "sqlite-autoconf-$SQLITE_CODE"
            # 编译开关对齐主流发行版：FTS/RTREE/JSON/数学函数这些第三方库常用的
            # 特性系统 sqlite 未必全开，自己编就能保证到哪台机器上行为都一样。
            cc -c -O2 -fPIC "-mmacosx-version-min=$MACOSX_DEPLOYMENT_TARGET" \
              -DSQLITE_THREADSAFE=1 \
              -DSQLITE_ENABLE_COLUMN_METADATA=1 \
              -DSQLITE_ENABLE_FTS3=1 -DSQLITE_ENABLE_FTS3_PARENTHESIS=1 \
              -DSQLITE_ENABLE_FTS4=1 -DSQLITE_ENABLE_FTS5=1 \
              -DSQLITE_ENABLE_RTREE=1 -DSQLITE_ENABLE_GEOPOLY=1 \
              -DSQLITE_ENABLE_MATH_FUNCTIONS=1 \
              -DSQLITE_ENABLE_DBSTAT_VTAB=1 -DSQLITE_ENABLE_STMTVTAB=1 \
              -DSQLITE_SECURE_DELETE=1 -DSQLITE_USE_URI=1 \
              -DSQLITE_MAX_VARIABLE_NUMBER=250000 \
              sqlite3.c -o sqlite3.o
            ar rcs "$DEPS/lib/libsqlite3.a" sqlite3.o
            cp sqlite3.h sqlite3ext.h "$DEPS/include/" )

          ls -la "$DEPS/lib"

      - name: Configure & build (arm64, PGO + LTO)
        working-directory: cpython
        run: |
          set -eux
          # ★ 把 Homebrew 整个踢出 PATH ★
          # CPython 3.11+ 的 configure 会主动调 `brew --prefix` 去找 sqlite / gdbm /
          # ncurses / tcl-tk 等 keg-only 包并塞进 CPPFLAGS/LDFLAGS。一旦命中，
          # _sqlite3.so / _curses.so 就会链到 /opt/homebrew/...，绿色包在没装 brew 的
          # 机器上直接 ImportError —— 而且原来的自检只看 _ssl/_lzma，完全查不出来。
          # 清掉 PATH 后，openssl/xz/zlib/sqlite 用上面自编的静态库，
          # 其余（ncurses/ffi/bz2/libedit）走系统 SDK，都在 /usr/lib。
          export PATH=/usr/bin:/bin:/usr/sbin:/sbin
          # 顺带也没有 pkg-config 了，PKG_CHECK_MODULES 会走系统回退分支，符合预期。
          # 下面这些 *_CFLAGS/*_LIBS 一旦预设，pkg.m4 就直接采用、跳过探测，
          # 于是链接的必然是我们的 .a —— 是否真的生效由 Functional gate 里的版本断言兜底。
          export LIBLZMA_CFLAGS="-I$DEPS/include"
          export LIBLZMA_LIBS="$DEPS/lib/liblzma.a"
          export ZLIB_CFLAGS="-I$DEPS/include"
          export ZLIB_LIBS="$DEPS/lib/libz.a"
          export LIBSQLITE3_CFLAGS="-I$DEPS/include"
          export LIBSQLITE3_LIBS="$DEPS/lib/libsqlite3.a -lm"

          # 3.13+ 才有 --without-static-libpython，能从源头不生成 libpython*.a。
          # 3.12 没有这个开关，靠下一步 rm 兜底；这里做成自适应，换版本时自动生效。
          EXTRA=
          ./configure --help > "$RUNNER_TEMP/conf-help.txt" 2>&1 || true
          if grep -q -- '--without-static-libpython' "$RUNNER_TEMP/conf-help.txt"; then
            EXTRA=--without-static-libpython
          fi

          ./configure \
            --prefix="$PY_PREFIX" \
            --enable-shared \
            --enable-optimizations \
            --with-lto \
            --with-openssl="$DEPS" \
            --with-readline=editline \
            --with-ensurepip=install \
            --enable-loadable-sqlite-extensions \
            $EXTRA
          make -j"$NPROC"

      - name: Install to staging & drop static libpython
        run: |
          set -eux
          ( cd cpython && make install DESTDIR="$GITHUB_WORKSPACE/_stage" )

          # ★★ 本次两个报错的共同根因 ★★
          # --enable-shared 只是让 .dylib 多了出来，libainstall 仍然会把
          # libpython3.12.a / python.o 装进 config-<ver>-darwin/。后果有两条：
          #  1) Nuitka 的 --static-libpython 默认 auto，会按 sysconfig 的 LIBPL 找到这个 .a
          #     并静态链接；叠加 LTO + dead_strip 后 CPython 符号被裁，dist 里的 .so 一
          #     dlopen 就报 "symbol not found in flat namespace '_PyBool_Type'"。
          #  2) .a 是 ar 归档不是 Mach-O，任何逐文件签名/改 install_name 的下游流程
          #     （codesign_allocate、Nuitka 的依赖扫描、macholib…）都会报
          #     "libpython3.12.a is not a Mach-O file"。
          # 共享构建下它是纯粹的死重量（~35MB），删掉不影响第三方库编译扩展
          # （macOS 上扩展模块用 -undefined dynamic_lookup，从不链接 libpython）。
          find "$PYROOT" \( -name 'libpython*.a' -o -name 'python.o' \) -print -delete

          ls -la "$PYROOT/bin" "$PYROOT/lib"

      # --enable-shared 之后 bin/python3.12 会硬指 /opt/python-<ver>/lib/libpython*.dylib
      # 这个绝对路径。产物装在暂存目录里，该路径并不存在，不改写的话下一步的功能自检
      # 就会 dyld 失败。顺带也让整棵树真正可搬家。
      - name: Make relocatable & re-sign
        run: |
          set -eu
          DYLIB="$PYROOT/lib/libpython$PYMM.dylib"
          test -e "$DYLIB" || { echo "::error::--enable-shared 未生效，缺少 $DYLIB"; exit 1; }

          # 按魔数判定，比 `file` 输出匹配可靠：ar 归档("!<arch>")、脚本、.pyc 全部被排除。
          is_macho() {
            case "$1" in *.a) return 1 ;; esac
            case "$(od -An -tx1 -N4 "$1" 2>/dev/null | tr -d ' \n')" in
              cffaedfe|cefaedfe|feedface|feedfacf|cafebabe|bebafeca) return 0 ;;
              *) return 1 ;;
            esac
          }

          # 1) 让 dylib 自报 @rpath，解开与 --prefix 的绑定
          install_name_tool -id "@rpath/libpython$PYMM.dylib" "$DYLIB"
          codesign -f -s - "$DYLIB"

          # 2) 扫描所有仍引用绝对 prefix 的 Mach-O 并改写。
          #    不枚举文件名：CPython 各版本对扩展模块的链接方式并不一致，扫描更可靠。
          #    候选集限定为 bin/* + *.so + *.dylib —— CPython 树里的 Mach-O 只可能在这三处。
          while IFS= read -r -d '' f; do
            is_macho "$f" || continue
            # 精确匹配依赖行（以空白开头），而不是宽泛的 $PY_PREFIX/——否则 otool 打印的
            # 文件自身路径也会命中。
            otool -L "$f" 2>/dev/null | tail -n +2 \
              | grep -q "^[[:space:]]*$PY_PREFIX/lib/libpython$PYMM\.dylib" || continue
            echo "rewrite: $f"
            install_name_tool -change "$PY_PREFIX/lib/libpython$PYMM.dylib" \
                                      "@rpath/libpython$PYMM.dylib" "$f"
            case "$f" in
              "$PYROOT"/bin/*)
                install_name_tool -add_rpath "@executable_path/../lib" "$f" 2>/dev/null || true ;;
              *)
                echo "::warning::$f 也链接了 libpython，请手工确认它的 rpath" ;;
            esac
            # install_name_tool 会破坏签名；arm64 上签名无效的 Mach-O 会被内核直接 SIGKILL
            codesign -f -s - "$f"
          done < <(find "$PYROOT" -type f \
                     \( -name '*.so' -o -name '*.dylib' -o -path "$PYROOT/bin/*" \) -print0)

          echo "=== 改写结果 ==="
          otool -D "$DYLIB"
          otool -L "$PYROOT/bin/python$PYMM"
          otool -l "$PYROOT/bin/python$PYMM" | grep -A2 LC_RPATH

      # 全树硬断言：只要还有一条依赖/rpath 指向构建机，绿色包就是假的。
      # 原来只查 _ssl/_lzma，_sqlite3、_curses 这类被 brew 污染的模块查不出来。
      - name: Assert self-contained & relocatable
        run: |
          set -eu
          is_macho() {
            case "$1" in *.a) return 1 ;; esac
            case "$(od -An -tx1 -N4 "$1" 2>/dev/null | tr -d ' \n')" in
              cffaedfe|cefaedfe|feedface|feedfacf|cafebabe|bebafeca) return 0 ;;
              *) return 1 ;;
            esac
          }
          ver2num() { awk -F. '{printf "%d", $1*10000 + $2*100 + ($3=="" ? 0 : $3)}' <<<"$1"; }

          echo "=== 构建形态 ==="
          shared=$("$PYROOT/bin/python3" -c "import sysconfig;print(sysconfig.get_config_var('Py_ENABLE_SHARED'))")
          [ "$shared" = "1" ] || { echo "::error::Py_ENABLE_SHARED=$shared，必须为 1"; exit 1; }
          test -e "$PYROOT/lib/libpython$PYMM.dylib"
          test -e "$PYROOT/include/python$PYMM/Python.h"

          echo "=== 不允许残留 ar 归档（Nuitka 静态链接 + codesign 报错的源头）==="
          leftover=$(find "$PYROOT" \( -name '*.a' -o -name 'python.o' \) -print)
          [ -z "$leftover" ] || { echo "::error::产物里仍有非 Mach-O 归档：$leftover"; exit 1; }

          bad=0
          limit=$(ver2num "$MACOSX_DEPLOYMENT_TARGET")
          while IFS= read -r -d '' f; do
            is_macho "$f" || continue

            # 依赖白名单：系统库 + @ 相对引用。其余（/opt/homebrew、/usr/local、
            # $RUNNER_TEMP、$PY_PREFIX 绝对路径…）一律判失败。
            while read -r d; do
              [ -n "$d" ] || continue
              case "$d" in
                /usr/lib/*|/System/Library/*) ;;
                @rpath/*|@loader_path/*|@executable_path/*) ;;
                *) echo "::error::外部依赖 $f -> $d"; bad=1 ;;
              esac
            done < <(otool -L "$f" | tail -n +2 | awk '{print $1}')

            # rpath 必须全部是 @ 开头，不能留构建机的绝对路径
            while read -r p; do
              [ -n "$p" ] || continue
              case "$p" in @*) ;; *) echo "::error::可疑 rpath $p in $f"; bad=1 ;; esac
            done < <(otool -l "$f" | awk '/cmd LC_RPATH/{r=1} r && /^ *path /{print $2; r=0}')

            # 部署目标：任何一个静态依赖没吃到 -mmacosx-version-min，这里会把它点名
            m=$(otool -l "$f" | awk '/LC_BUILD_VERSION/{b=1} b && /^ *minos/{print $2; exit}')
            if [ -n "$m" ] && [ "$(ver2num "$m")" -gt "$limit" ]; then
              echo "::error::$f minos=$m > $MACOSX_DEPLOYMENT_TARGET"; bad=1
            fi
          done < <(find "$PYROOT" -type f \
                     \( -name '*.so' -o -name '*.dylib' -o -path "$PYROOT/bin/*" \) -print0)

          [ "$bad" = 0 ] || { echo "::error::自包含/可搬家断言失败，见上方 error"; exit 1; }
          echo "全部 Mach-O 仅依赖系统库，rpath 全相对，minos <= $MACOSX_DEPLOYMENT_TARGET"

          # 把实际下限打进日志。注意这道断言是 "<= 声明值"，所以调高 MACOSX_DEPLOYMENT_TARGET
          # 会自动放宽它 —— 下面这张分布表才是唯一能看出产物真实下限的东西，每次构建都留档。
          echo "=== 实际 minos 分布（左列=文件数）==="
          find "$PYROOT" -type f \( -name '*.so' -o -name '*.dylib' -o -path "$PYROOT/bin/*" \) -print0 |
          while IFS= read -r -d '' f; do
            otool -l "$f" 2>/dev/null | awk '/LC_BUILD_VERSION/{b=1} b && /^ *minos/{print $2; exit}'
          done | grep -v '^$' | sort | uniq -c

      - name: Functional gate (modules + TLS)
        run: |
          set -eu
          # 注意跑的是暂存路径（≠ --prefix），能跑通本身就证明整棵树可搬家
          "$PYROOT/bin/python3" -VV
          "$PYROOT/bin/python3" - <<'PYEOF'
          import importlib, os, ssl, sys, time, urllib.request

          REQUIRED = """
          ssl hashlib lzma bz2 zlib sqlite3 ctypes curses readline decimal uuid
          socket select mmap pyexpat unicodedata array fcntl termios grp pwd
          multiprocessing venv ensurepip zoneinfo json csv sysconfig
          """.split()
          OPTIONAL = ["tkinter", "dbm.gnu", "dbm.ndbm", "_curses_panel"]

          missing = []
          for m in REQUIRED:
              try:
                  importlib.import_module(m)
              except Exception as e:
                  missing.append(f"{m}: {e!r}")
          for m in OPTIONAL:
              try:
                  importlib.import_module(m)
                  print("optional OK      :", m)
              except Exception as e:
                  print("optional MISSING :", m, "--", e)
          if missing:
              for x in missing:
                  print("::error::缺少必需模块", x)
              sys.exit(1)
          print("required modules OK :", len(REQUIRED))

          # ---- 静态依赖版本断言 ----
          # 这是"静态链接到底有没有生效"的唯一可靠证据：只要 *_CFLAGS/*_LIBS 没被
          # pkg.m4 采纳，configure 就会静默回落到 /usr/lib 的系统库，构建照样成功、
          # 模块照样能 import，只有版本号会不一样。
          import sqlite3, zlib
          pinned = [
              ("OpenSSL", ssl.OPENSSL_VERSION.split()[1], os.environ["OPENSSL_VER"]),
              ("SQLite",  sqlite3.sqlite_version,          os.environ["SQLITE_VER"]),
              ("zlib",    zlib.ZLIB_RUNTIME_VERSION,       os.environ["ZLIB_VER"]),
          ]
          drift = []
          for label, actual, expect in pinned:
              print(f"{label:<20}: {actual}  (期望静态版本 {expect})")
              if actual != expect:
                  drift.append(f"{label}: 实际 {actual} != 期望 {expect}")
          if drift:
              for d in drift:
                  print("::error::静态依赖没生效，疑似回落到系统库 —", d)
              sys.exit(1)

          # 自编 sqlite 才有的能力：系统 libsqlite3 是关掉扩展加载的
          con = sqlite3.connect(":memory:")
          assert hasattr(con, "enable_load_extension"), "sqlite3 未编入扩展加载支持"
          for feat, sql in (("FTS5", "CREATE VIRTUAL TABLE t1 USING fts5(a)"),
                            ("RTREE", "CREATE VIRTUAL TABLE t2 USING rtree(id,x0,x1)"),
                            ("JSON", "SELECT json_extract('{\"a\":1}','$.a')"),
                            ("MATH", "SELECT ceil(1.2)")):
              try:
                  con.execute(sql)
              except Exception as e:
                  sys.exit(f"::error::SQLite 缺少 {feat}: {e}")
          con.close()
          print("SQLite 特性         : FTS5 / RTREE / JSON / MATH / load_extension 均可用")

          p = ssl.get_default_verify_paths()
          print("default cafile      :", p.openssl_cafile, os.path.exists(p.openssl_cafile or ""))

          # 真闸门：证书链能不能校验。openssldir 指向 /private/etc/ssl，
          # 用的是 macOS 自带 cert.pem，用户不必再跑 Install Certificates。
          last = None
          for i in range(3):
              try:
                  with urllib.request.urlopen("https://pypi.org/simple/", timeout=30) as r:
                      r.read(64)
                  print("TLS verify          : OK")
                  break
              except Exception as e:
                  last = e
                  time.sleep(3)
          else:
              sys.exit(f"::error::默认证书校验失败：{last!r}")
          PYEOF

      # 真正的闸门：用解释器自己跑什么都正常，问题只在 Nuitka 重新链接时才暴露。
      - name: Nuitka standalone smoke test (at canonical prefix)
        run: |
          set -eux
          # 把暂存树挂到 --prefix 的真实位置再测。
          # 这一步是必须的：sysconfig 里的 LIBPL/LIBDIR 是 configure 期烘死的绝对路径，
          # 在 runner 上不存在，Nuitka 的 static-libpython 自动探测因此永远落空 ——
          # 不还原部署形态，闸门就是假绿的，问题会留到用户装到 /opt 之后才爆。
          sudo mkdir -p /opt
          sudo ln -sfn "$PYROOT" "$PY_PREFIX"
          PY="$PY_PREFIX/bin/python3"
          "$PY" -c "import sysconfig,os; p=sysconfig.get_config_var('LIBPL'); print('LIBPL', p, os.path.isdir(p))"

          # Nuitka 装进临时 venv：
          #  1) 不污染产物（原来直接 pip install 进产物树，发出去的包里躺着 nuitka+zstandard）；
          #  2) 顺便验证 venv 场景下 @executable_path/../lib 仍能解析到 libpython。
          "$PY" -m venv "$RUNNER_TEMP/nuitka-venv"
          VPY="$RUNNER_TEMP/nuitka-venv/bin/python"
          "$VPY" -m pip install -q --disable-pip-version-check nuitka

          cd "$RUNNER_TEMP"
          cat > probe.py <<'EOF'
          import ssl, lzma, sqlite3, ctypes, hashlib, bz2, zlib, decimal, socket, json
          print("standalone OK", ssl.OPENSSL_VERSION, decimal.Decimal(1) / 3)
          EOF
          # --lto=yes 必须带：正是 LTO + 静态 libpython 这对组合把 CPython 符号吃掉的，
          # 这里要复现下游真实的链接条件，否则闸门形同虚设。
          "$VPY" -m nuitka --standalone --lto=yes \
            --assume-yes-for-downloads --output-dir=probe-out probe.py

          DIST=probe-out/probe.dist
          echo "=== dist 目录内容 ==="
          ls -la "$DIST"

          # 别写死产物名：Nuitka 在 POSIX 上给 standalone 二进制加 .bin 后缀，
          # 而这条规则在各版本间反复改过（onefile / app-bundle 分支各不相同）。
          BIN=
          for c in "$DIST/probe.bin" "$DIST/probe"; do
            if [ -f "$c" ]; then BIN="$c"; break; fi
          done
          [ -n "$BIN" ] || { echo "::error::没找到 Nuitka standalone 产物，见上方目录列表"; exit 1; }
          echo "binary: $BIN"

          echo "=== 链接形态：必须是动态 libpython ==="
          otool -L "$BIN"
          otool -L "$BIN" | grep -q "libpython$PYMM" || {
            echo "::error::Nuitka 静态链接了 libpython —— 产物里一定还残留着 libpython$PYMM.a"; exit 1; }
          if ! ls "$DIST"/libpython"$PYMM"*.dylib >/dev/null 2>&1; then
            echo "::error::dist 里没有 libpython$PYMM*.dylib，Nuitka 没把解释器动态库带进来"; exit 1
          fi

          "$BIN"

      - name: Package tar.gz
        run: |
          set -eux
          sudo rm -f "$PY_PREFIX"        # 撤掉 /opt 上的符号链接

          # 随包发一份构建清单。"最低 macOS 15.0" 这种硬约束不能只活在 workflow 里：
          # 低于下限的机器连解释器都起不来，用户拿到的只有一句 dyld 报错，
          # 没有这个文件他们无从判断是包坏了还是系统太旧。
          "$PYROOT/bin/python3" - > "$PYROOT/BUILD-INFO.txt" <<'PYEOF'
          import platform, sys, sysconfig, ssl, sqlite3, zlib, time
          sc = sysconfig.get_config_var
          print("PerfectPython — CPython macOS arm64 绿色包")
          print("=" * 52)
          print(f"CPython        : {platform.python_version()}")
          print(f"构建标识       : {sys.version}")
          print(f"生成时间       : {time.strftime('%Y-%m-%d %H:%M:%S %z')}")
          print()
          print(f"最低系统要求   : macOS {sc('MACOSX_DEPLOYMENT_TARGET')}  "
                f"← 低于此版本 dyld 会直接拒绝加载，解释器无法启动")
          print(f"架构           : arm64 (Apple Silicon)")
          print(f"libpython      : 动态 (Py_ENABLE_SHARED={sc('Py_ENABLE_SHARED')})")
          print()
          print("静态内置（不依赖用户系统版本）:")
          print(f"  OpenSSL      : {ssl.OPENSSL_VERSION}")
          print(f"  SQLite       : {sqlite3.sqlite_version}  (FTS5/RTREE/JSON/MATH/可加载扩展)")
          print(f"  zlib         : {zlib.ZLIB_RUNTIME_VERSION}")
          print(f"  liblzma      : 静态")
          print(f"  expat        : 内置")
          print()
          print("系统依赖       : 仅 /usr/lib 与 /System/Library（无 Homebrew 依赖）")
          print("不含           : tkinter (Tcl/Tk 为动态库，塞入会破坏自包含)")
          print()
          print("用法           : 解压到任意路径，直接执行 bin/python3")
          print("Gatekeeper     : 若被拦截，执行")
          print("                 xattr -dr com.apple.quarantine <解压目录>")
          PYEOF
          cat "$PYROOT/BUILD-INFO.txt"
          { echo '```text'; cat "$PYROOT/BUILD-INFO.txt"; echo '```'; } \
            >> "$GITHUB_STEP_SUMMARY" || true

          cd "$GITHUB_WORKSPACE/_stage/opt"
          # COPYFILE_DISABLE=1：不然 macOS tar 会给每个文件塞一份 ._xxx AppleDouble
          COPYFILE_DISABLE=1 tar -czf \
            "$GITHUB_WORKSPACE/python-$PY_VER-macos-arm64.tar.gz" "python-$PY_VER"
          cd "$GITHUB_WORKSPACE"
          shasum -a 256 "python-$PY_VER-macos-arm64.tar.gz" \
            | tee "python-$PY_VER-macos-arm64.tar.gz.sha256"
          du -h "python-$PY_VER-macos-arm64.tar.gz"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: python-${{ env.PY_VER }}-macos-arm64
          path: |
            python-${{ env.PY_VER }}-macos-arm64.tar.gz
            python-${{ env.PY_VER }}-macos-arm64.tar.gz.sha256
          if-no-files-found: error
          compression-level: 0   # 已经是 tar.gz，再压一遍纯属浪费
